name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        # Auto-derive the version (MAJOR.MINOR.<run-number>) rather than reading
        # the trigger tag. electron-builder and the renderer both read it from
        # package.json. Not committed back — the runner checkout is throwaway.
        shell: bash
        run: npm version "$(node scripts/app-version.mjs)" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm test
      - name: Build and publish desktop app
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds for now — don't attempt macOS code signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
